name: CI

on:
  # Temporarily manual-only while the client refactor is in progress.
  # Restore push, pull_request, and schedule triggers to re-enable automation.
  # With schedule restored (nightly, e.g. cron '0 2 * * *'), the soak job runs
  # on every scheduled run; manually it runs when the soak input is set.
  workflow_dispatch:
    inputs:
      soak:
        description: 'Run the nightly soak suite (scene cycles, reconnect storms, map streaming)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNITY_EDITOR_VERSION: 6000.6.0f1
  UNITY_NO_CONSENT_PROMPT: '1'
  UNITY_NO_UPDATE_CHECK: '1'

jobs:
  architecture:
    name: Architecture and asset contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v7
        with:
          dotnet-version: '10.0.x'
      - name: Validate architecture, USS, and localization
        run: dotnet run --project tools/Kern.ArchitectureLinter
      - name: Test display mode lifecycle without Unity
        run: dotnet test tools/Kern.DisplayTests/Kern.DisplayTests.csproj --verbosity minimal

  macos-tests:
    name: Unity tests (macOS ARM64)
    needs: architecture
    runs-on: [self-hosted, macOS, ARM64, kern-unity]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Bake planet maps
        # Карты планеты в репозитории не лежат: это детерминированный вывод
        # генератора, и в 8K они весят под 150 МБ, которые осели бы в истории
        # на каждой перепечке. Запекаем перед тем, как Unity тронет проект:
        # если он импортирует .meta без самого файла, то удалит .meta, и
        # ссылки из PlanetSurface.mat повиснут по GUID.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy pillow
          python3 scripts/generate_planet_maps.py
      - name: Verify toolchain
        run: |
          unity --version
          unity editors --installed --format json
      - name: EditMode tests
        run: >-
          unity test . --editor-version "$UNITY_EDITOR_VERSION"
          --mode EditMode --report-format nunit,junit
          --output TestResults/editmode.xml
          --junit-output TestResults/editmode.junit.xml
          --timeout 1200 --format github
      - name: PlayMode tests
        run: >-
          unity test . --editor-version "$UNITY_EDITOR_VERSION"
          --mode PlayMode --report-format nunit,junit
          --output TestResults/playmode.xml
          --junit-output TestResults/playmode.junit.xml
          --timeout 1800 --format github
          -- -testCategory "!Soak"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results-macos
          path: TestResults/
          retention-days: 14
          if-no-files-found: warn

  windows-tests:
    name: Unity tests (Windows x64)
    needs: architecture
    runs-on: [self-hosted, Windows, X64, kern-unity]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Bake planet maps
        # Карты планеты в репозитории не лежат: это детерминированный вывод
        # генератора, и в 8K они весят под 150 МБ, которые осели бы в истории
        # на каждой перепечке. Запекаем перед тем, как Unity тронет проект:
        # если он импортирует .meta без самого файла, то удалит .meta, и
        # ссылки из PlanetSurface.mat повиснут по GUID.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy pillow
          python3 scripts/generate_planet_maps.py
      - name: Verify toolchain
        shell: pwsh
        run: |
          unity --version
          unity editors --installed --format json
      - name: EditMode tests
        shell: pwsh
        run: >-
          unity test . --editor-version "$env:UNITY_EDITOR_VERSION"
          --mode EditMode --report-format nunit,junit
          --output TestResults/editmode.xml
          --junit-output TestResults/editmode.junit.xml
          --timeout 1200 --format github
      - name: PlayMode tests
        shell: pwsh
        run: >-
          unity test . --editor-version "$env:UNITY_EDITOR_VERSION"
          --mode PlayMode --report-format nunit,junit
          --output TestResults/playmode.xml
          --junit-output TestResults/playmode.junit.xml
          --timeout 1800 --format github
          -- -testCategory "!Soak"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results-windows
          path: TestResults/
          retention-days: 14
          if-no-files-found: warn

  macos-soak:
    name: Soak (macOS ARM64)
    if: github.event_name == 'schedule' || inputs.soak
    needs: macos-tests
    runs-on: [self-hosted, macOS, ARM64, kern-unity]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Bake planet maps
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy pillow
          python3 scripts/generate_planet_maps.py
      - name: Soak tests
        run: >-
          unity test . --editor-version "$UNITY_EDITOR_VERSION"
          --mode PlayMode --report-format nunit,junit
          --output TestResults/soak.xml
          --junit-output TestResults/soak.junit.xml
          --timeout 13000 --format github
          -- -testCategory "Soak"
      - name: Collect soak metrics
        if: always()
        run: |
          mkdir -p TestResults/soak-metrics
          cp -R "$HOME/Library/Application Support/DefaultCompany/Project Kern/Soak/." TestResults/soak-metrics/ 2>/dev/null || true
      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-soak-results-macos
          path: TestResults/
          retention-days: 30
          if-no-files-found: warn

  macos-player:
    name: IL2CPP player (macOS ARM64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: macos-tests
    runs-on: [self-hosted, macOS, ARM64, kern-unity]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Bake planet maps
        # Карты планеты в репозитории не лежат: это детерминированный вывод
        # генератора, и в 8K они весят под 150 МБ, которые осели бы в истории
        # на каждой перепечке. Запекаем перед тем, как Unity тронет проект:
        # если он импортирует .meta без самого файла, то удалит .meta, и
        # ссылки из PlanetSurface.mat повиснут по GUID.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy pillow
          python3 scripts/generate_planet_maps.py
      - name: Build player
        run: >-
          unity run . --editor-version "$UNITY_EDITOR_VERSION"
          --timeout 7000 --format github --
          -nographics -executeMethod Kern.Editor.BuildScript.BuildMacOS
      - uses: actions/upload-artifact@v7
        with:
          name: kern-macos-arm64
          path: Build/macOS/
          retention-days: 14
          if-no-files-found: error

  windows-player:
    name: IL2CPP player (Windows x64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: windows-tests
    runs-on: [self-hosted, Windows, X64, kern-unity]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Bake planet maps
        # Карты планеты в репозитории не лежат: это детерминированный вывод
        # генератора, и в 8K они весят под 150 МБ, которые осели бы в истории
        # на каждой перепечке. Запекаем перед тем, как Unity тронет проект:
        # если он импортирует .meta без самого файла, то удалит .meta, и
        # ссылки из PlanetSurface.mat повиснут по GUID.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy pillow
          python3 scripts/generate_planet_maps.py
      - name: Build player
        shell: pwsh
        run: >-
          unity run . --editor-version "$env:UNITY_EDITOR_VERSION"
          --timeout 7000 --format github --
          -nographics -executeMethod Kern.Editor.BuildScript.BuildWindows
      - uses: actions/upload-artifact@v7
        with:
          name: kern-windows-x64
          path: Build/Windows/
          retention-days: 14
          if-no-files-found: error
