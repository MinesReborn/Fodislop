name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      soak:
        description: 'Run the nightly soak suite (scene cycles, reconnect storms, map streaming)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNITY_EDITOR_VERSION: 6000.6.0f1
  UNITY_NO_CONSENT_PROMPT: '1'
  UNITY_NO_UPDATE_CHECK: '1'
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          from="$EVENT_BEFORE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            from="$BASE_SHA"
          fi

          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ]; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only "$from" "$HEAD_SHA")
          fi

          if printf '%s\n' "$files" | grep -Eq '^(Assets/|Packages/|ProjectSettings/|tools/|\.github/workflows/)|\.(cs|asmdef|shader|hlsl|compute|cginc|uxml|uss|unity|prefab|asset|meta|csproj|sln)$'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  static-contracts:
    name: Static architecture and asset contracts
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build architecture linter
        run: dotnet build tools/Kern.ArchitectureLinter --nologo --verbosity quiet
      - name: Check architecture and settings contracts
        run: dotnet run --project tools/Kern.ArchitectureLinter --no-build --no-restore -- --source-only
      - name: Test terrain raster coverage and AO geometry without Unity
        run: node tools/terrain-raster-tests/run.js
      - name: Test display mode lifecycle without Unity
        run: dotnet test tools/Kern.DisplayTests/Kern.DisplayTests.csproj --verbosity minimal

  architecture:
    name: Architecture and asset contracts
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Install Unity CLI and activate license
        run: bash .github/scripts/prepare-unity.sh
      - name: Rebuild Unity assemblies from this checkout
        run: |
          unity test . --editor-version "$UNITY_EDITOR_VERSION" --allow-install \
            --mode EditMode --report-format nunit \
            --output TestResults/architecture-editmode.xml \
            --timeout 1200 --format github
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run the same C# checks as the local pre-commit hook
        run: CI=true ./scripts/pre-commit-lint.sh
      - name: Test terrain raster coverage and AO geometry without Unity
        run: node tools/terrain-raster-tests/run.js
      - name: Test display mode lifecycle without Unity
        run: dotnet test tools/Kern.DisplayTests/Kern.DisplayTests.csproj --verbosity minimal

  macos-tests:
    name: Unity tests (macOS ARM64)
    needs: architecture
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Install Unity CLI and activate license
        run: bash .github/scripts/prepare-unity.sh
      - name: EditMode tests
        run: >-
          unity test . --editor-version "$UNITY_EDITOR_VERSION" --allow-install
          --mode EditMode --report-format nunit,junit
          --output TestResults/editmode.xml
          --junit-output TestResults/editmode.junit.xml
          --timeout 1200 --format github
      - name: PlayMode tests
        run: >-
          unity test . --editor-version "$UNITY_EDITOR_VERSION" --allow-install
          --mode PlayMode --report-format nunit,junit
          --output TestResults/playmode.xml
          --junit-output TestResults/playmode.junit.xml
          --timeout 1800 --format github
          -- -testCategory "!Soak"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results-macos
          path: TestResults/
          retention-days: 14
          if-no-files-found: warn

  windows-tests:
    name: Unity tests (Windows x64)
    needs: architecture
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Install Unity CLI and activate license
        shell: pwsh
        run: .github/scripts/prepare-unity.ps1
      - name: EditMode tests
        shell: pwsh
        run: >-
          unity test . --editor-version "$env:UNITY_EDITOR_VERSION" --allow-install
          --mode EditMode --report-format nunit,junit
          --output TestResults/editmode.xml
          --junit-output TestResults/editmode.junit.xml
          --timeout 1200 --format github
      - name: PlayMode tests
        shell: pwsh
        run: >-
          unity test . --editor-version "$env:UNITY_EDITOR_VERSION" --allow-install
          --mode PlayMode --report-format nunit,junit
          --output TestResults/playmode.xml
          --junit-output TestResults/playmode.junit.xml
          --timeout 1800 --format github
          -- -testCategory "!Soak"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results-windows
          path: TestResults/
          retention-days: 14
          if-no-files-found: warn

  macos-soak:
    name: Soak (macOS ARM64)
    if: github.event_name == 'schedule' || inputs.soak
    needs: macos-tests
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Install Unity CLI and activate license
        run: bash .github/scripts/prepare-unity.sh
      - name: Soak tests
        run: >-
          unity test . --editor-version "$UNITY_EDITOR_VERSION" --allow-install
          --mode PlayMode --report-format nunit,junit
          --output TestResults/soak.xml
          --junit-output TestResults/soak.junit.xml
          --timeout 13000 --format github
          -- -testCategory "Soak"
      - name: Collect soak metrics
        if: always()
        run: |
          mkdir -p TestResults/soak-metrics
          cp -R "$HOME/Library/Application Support/DefaultCompany/Project Kern/Soak/." TestResults/soak-metrics/ 2>/dev/null || true
      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-soak-results-macos
          path: TestResults/
          retention-days: 30
          if-no-files-found: warn

  macos-player:
    name: IL2CPP player (macOS ARM64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: macos-tests
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Install Unity CLI and activate license
        run: bash .github/scripts/prepare-unity.sh
      - name: Build player
        run: >-
          unity run . --editor-version "$UNITY_EDITOR_VERSION"
          --allow-install --timeout 7000 --format github --
          -nographics -executeMethod Kern.Editor.BuildScript.BuildMacOS
      - uses: actions/upload-artifact@v7
        with:
          name: kern-macos-arm64
          path: Build/macOS/
          retention-days: 14
          if-no-files-found: error

  windows-player:
    name: IL2CPP player (Windows x64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: windows-tests
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Install Unity CLI and activate license
        shell: pwsh
        run: .github/scripts/prepare-unity.ps1
      - name: Build player
        shell: pwsh
        run: >-
          unity run . --editor-version "$env:UNITY_EDITOR_VERSION"
          --allow-install --timeout 7000 --format github --
          -nographics -executeMethod Kern.Editor.BuildScript.BuildWindows
      - uses: actions/upload-artifact@v7
        with:
          name: kern-windows-x64
          path: Build/Windows/
          retention-days: 14
          if-no-files-found: error
