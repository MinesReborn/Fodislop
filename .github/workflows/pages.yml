name: Deploy Kern Interface Lab

on:
  push:
    branches: [main]
    paths:
      - 'visual/kern-ui-lab/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'visual/kern-ui-lab/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  package:
    name: Package Interface Lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify static site
        run: test -f visual/kern-ui-lab/index.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: visual/kern-ui-lab

  deploy:
    name: Publish Interface Lab
    needs: package
    if: github.repository == 'murasamadsp/Fodislop' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
