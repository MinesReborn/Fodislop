name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# game-ci needs an editor image. The project is pinned to Unity 6000.7.0b4,
# which has no published unityci/editor image, so set the repository variable
# UNITY_CI_IMAGE to the custom image built by the "Unity editor image" workflow.
# When the variable is empty game-ci falls back to unityVersion.
jobs:
  test:
    name: Tests (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - name: Log in to GHCR
        if: vars.UNITY_CI_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto
          customImage: ${{ vars.UNITY_CI_IMAGE }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} test results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: artifacts/${{ matrix.testMode }}
          if-no-files-found: ignore

  build:
    name: Build (StandaloneWindows64)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-build-
            Library-

      - name: Log in to GHCR
        if: vars.UNITY_CI_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          # На агенте нет FMOD Studio: используем банки, закоммиченные в KernAudio/Build/Desktop.
          KERN_FMOD_SKIP_COMPILE: "1"
        with:
          unityVersion: auto
          customImage: ${{ vars.UNITY_CI_IMAGE }}
          targetPlatform: StandaloneWindows64
          buildMethod: Kern.Editor.BuildScript.BuildWindows
          # CI собирает development-сборку и не пересобирает FMOD-банки (их нет на агенте).
          customParameters: -kernDev -kernFmodSkipCompile

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-StandaloneWindows64
          path: Build/Windows
          if-no-files-found: ignore
