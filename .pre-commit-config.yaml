exclude: '^(Assets/Plugins/|Packages/|Library/|Assets/Resources/Rendering/GraphicsStates\.graphicsstate$|.*\.unity$|.*\.prefab$|.*\.asset$|.*\.mat$|.*\.anim$|.*\.controller$|.*\.mask$|.*\.meta$|.*\.spriteatlas$|.*\.playable$|.*\.overrideController$|.*\.physicMaterial$|.*\.physicsMaterial2D$|.*\.tss$|.*\.scenetemplate$|.*\.inputactions$|.*\.dll$)'

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
          - id: trailing-whitespace
            exclude: \.md$
          - id: end-of-file-fixer
          - id: check-json
            exclude: \.vscode/
          - id: check-yaml
          - id: check-merge-conflict
          - id: check-added-large-files
            args: ["--maxkb=15000"]
          - id: mixed-line-ending
            args: ["--fix=lf"]

    - repo: local
      hooks:
          - id: kern-unified-ci
            name: Kern Unified CI
            entry: ./scripts/run-ci.sh
            language: script
            always_run: true
            pass_filenames: false
