exclude: '^(Assets/Plugins/|Packages/|Library/|.*\.unity$|.*\.prefab$|.*\.asset$|.*\.mat$|.*\.anim$|.*\.controller$|.*\.mask$|.*\.meta$|.*\.spriteatlas$|.*\.playable$|.*\.overrideController$|.*\.physicMaterial$|.*\.physicsMaterial2D$|.*\.tss$|.*\.scenetemplate$|.*\.inputactions$|.*\.dll$)'

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
          - id: trailing-whitespace
            exclude: \.md$
          - id: end-of-file-fixer
          - id: check-json
            exclude: \.vscode/
          - id: check-yaml
          - id: check-merge-conflict
          - id: check-added-large-files
            args: ["--maxkb=15000"]
          - id: mixed-line-ending
            args: ["--fix=lf"]

    - repo: local
      hooks:
          - id: dotnet-build-lint
            name: C# Roslyn Analyzers
            entry: ./scripts/pre-commit-lint.sh
            language: script
            always_run: true
            pass_filenames: false
          - id: forbid-anti-patterns
            name: Enforce Kern architecture, DI/lifecycle and settings-wiring invariants
            entry: dotnet run --project tools/Kern.ArchitectureLinter --no-build
            language: system
            always_run: true
            pass_filenames: false
