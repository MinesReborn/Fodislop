<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05080d">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Fodinae Interface Lab — сектор не найден</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 35%, #102b32 0, #071016 30%, #030507 72%); color: #dce9ec; }
    main { width: min(680px, calc(100vw - 40px)); padding: 48px; border: 1px solid #2e6972; background: rgb(5 12 17 / 88%); box-shadow: 0 0 80px rgb(37 196 215 / 12%); }
    .code { color: #64dbe8; font-size: clamp(64px, 15vw, 132px); line-height: .8; letter-spacing: -.08em; }
    .eyebrow { margin: 28px 0 8px; color: #d4a84f; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font: inherit; font-size: clamp(24px, 5vw, 40px); text-transform: uppercase; }
    p { max-width: 52ch; color: #8fa8ad; line-height: 1.7; }
    a { display: inline-block; margin-top: 18px; padding: 12px 18px; border: 1px solid #64dbe8; color: #64dbe8; text-decoration: none; text-transform: uppercase; letter-spacing: .08em; }
    a:hover { background: #64dbe8; color: #05080d; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <div class="eyebrow">Навигационная ошибка</div>
    <h1>Сектор не найден</h1>
    <p>Запрошенный интерфейс отсутствует в текущей карте экспедиции. Вернитесь в лабораторию и выберите доступное состояние клиента.</p>
    <a href="/Fodislop/">Вернуться в Interface Lab</a>
  </main>
</body>
</html>
