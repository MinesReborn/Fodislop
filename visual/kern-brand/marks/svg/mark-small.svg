<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linejoin="miter" stroke-linecap="square">
  <!-- Знак Project Kern для 32 px и меньше: внутренняя грань и засечки при такой величине сливаются в серую кашу —
       остаются контур шестигранника толще и ядро крупнее. Построен по пиксельной сетке 16 px (4 единицы = 1 px):
       вертикальные грани по центру x = 8 и 56, обводка 8 = ровно 2 px — грани не размываются между пикселями.
       Внутри шестигранника — базальт: на светлой панели задач контур кости иначе пропадает. Центр — как у основного знака -->
  <path d="M32 4.29 56 18.14v27.71L32 59.71 8 45.86v-27.71z" fill="#111018" stroke="#d8d5ee" stroke-width="8"/>
  <path d="M32 19 45 32 32 45 19 32z" fill="#ff5a1f"/>
</svg>
