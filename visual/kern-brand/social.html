<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Project Kern — шаблон соцсетей</title>
<link rel="stylesheet" href="../kern-ui/css/tokens.css">
<!-- Шаблоны площадок: ?f=avatar|x|youtube|vk|discord|telegram|post|story. Размер кадра — в FORMATS, текст — в TEXT.
     Экспорт в PNG — tools/export-social.sh -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--void); }
body { position: relative; color: var(--bone); font-family: var(--font-text); }
.bg { position: absolute; inset: 0; background: var(--dots), radial-gradient(circle at 35% 45%, #15131f, var(--void) 75%); }
.frame-ticks { position: absolute; inset: calc(var(--u) * 3); background: var(--ticks); --tick: calc(var(--u) * 2); --tick-c: rgb(var(--rgb-bone) / .6); }
/* Колонка керна — у правого края, за полем содержимого */
.core { position: absolute; top: 0; bottom: 0; right: calc(var(--u) * 2); width: calc(var(--u) * 3.4); background:
  linear-gradient(transparent 0 38%, var(--signal) 38% 46%, transparent 46% 80%, rgb(var(--rgb-cobalt) / .55) 80% 83%, transparent 83%),
  var(--hatch), rgb(var(--rgb-well) / .9); border-left: 1px solid var(--seam-strong); border-right: 1px solid var(--seam-strong); }
.content { position: absolute; left: calc(var(--u) * 7); top: calc(var(--u) * 7); right: calc(var(--u) * 7); bottom: calc(var(--u) * 7); display: flex; flex-direction: column; justify-content: space-between; }
.top { display: flex; align-items: center; gap: calc(var(--u) * 1.2); font: 500 calc(var(--u) * .9)/1 var(--font-mono); letter-spacing: var(--ls-caps-wide); text-transform: uppercase; color: var(--ash); }
.top img { width: calc(var(--u) * 3); height: calc(var(--u) * 3); }
.top b { font: 600 calc(var(--u) * 1.8)/1 var(--font-display); letter-spacing: .03em; text-transform: none; color: var(--bone); }
.top .sp { flex: 1; }
h1 { width: max-content; font: 700 calc(var(--u) * 6.4)/.95 var(--font-display); white-space: nowrap; }
h1 > span { display: block; }
.content > div:nth-child(2) { padding-block: calc(var(--u) * 1.2); }
h1 > span:last-child { color: var(--signal); }
.sub { margin-top: calc(var(--u) * 1.6); font: 500 calc(var(--u) * 1)/1.3 var(--font-mono); letter-spacing: var(--ls-caps-wide); text-transform: uppercase; color: var(--mist); }
.bottom { display: flex; justify-content: space-between; align-items: end; font: 500 calc(var(--u) * .8)/1.4 var(--font-mono); color: var(--dim); letter-spacing: var(--ls-caps); text-transform: uppercase; }
.bottom b { color: var(--signal); }
/* Аватар и квадратные значки: только знак */
.mark-only { position: absolute; inset: 0; display: grid; place-items: center; }
.mark-only img { width: 62%; height: 62%; }
</style>
</head>
<body>
<div class="bg"></div>
<div id="root"></div>
<script>
const FORMATS = { avatar: [1024, 1024], x: [1500, 500], youtube: [2560, 1440], vk: [1920, 768], discord: [960, 540], telegram: [640, 640], post: [1080, 1080], story: [1080, 1920], 'ui-hud': [1920, 1080] };
// Заголовок — строками: переносы заданы, а не случайны; последняя строка — сигналом. В широких кадрах первые две строки — одной
const TEXT = { title: ['Под землёй', 'тоже есть', 'политика.'], sub: 'Экспедиция в недра планеты', foot: 'Project Kern' };
const f = new URLSearchParams(location.search).get('f') || 'post';
const [w, h] = FORMATS[f] || FORMATS.post;
const r = document.documentElement.style;
r.setProperty('--w', w + 'px'); r.setProperty('--h', h + 'px');
// Единица кадра — от короткой стороны, у вытянутых шапок — от высоты
// YouTube: значимое только в полосе 423 px по высоте — единица от неё, иначе служебные строки съедают место заголовка
r.setProperty('--u', (f === 'youtube' ? 423 / 19 : Math.min(w, h) / (w / h > 2.2 ? 32 : 44)) + 'px');
const root = document.getElementById('root');
if (f === 'avatar' || f === 'telegram') {
  root.innerHTML = `<div class="frame-ticks"></div><div class="mark-only"><img src="../kern-ui/img/brand/mark.svg" alt=""></div>`;
} else {
  // YouTube: всё значимое — в безопасной зоне 1546×423 по центру
  const safe = f === 'youtube' ? 'style="left:507px;right:507px;top:508px;bottom:508px"' : '';
  root.innerHTML = `<div class="core"></div><div class="frame-ticks"></div>
    <div class="content" ${safe}>
      <div class="top"><img src="../kern-ui/img/brand/mark.svg" alt=""><b>Project Kern</b><span class="sp"></span><span>K·00</span></div>
      <div><h1>${(w / h > 1.6 ? [TEXT.title[0] + ' ' + TEXT.title[1], TEXT.title[2]] : TEXT.title).map(t => `<span>${t}</span>`).join('')}</h1><p class="sub">${TEXT.sub}</p></div>
      <div class="bottom"><span>${TEXT.foot}</span><span>${f.toUpperCase()} · ${w}×${h}</span></div>
    </div>`;
  if (f === 'youtube') document.querySelector('.core').style.right = '260px';
  // Кегль заголовка подбирается под кадр: самая длинная строка — не шире поля до колонки, весь блок — не выше поля
  document.fonts.ready.then(() => {
    const h1 = document.querySelector('h1'), box = document.querySelector('.content');
    const maxW = box.clientWidth - (f === 'youtube' ? 0 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) * 2);
    let size = parseFloat(getComputedStyle(h1).fontSize);
    while (size > 8 && (h1.offsetWidth > maxW || box.scrollHeight > box.clientHeight)) { size -= 1; h1.style.fontSize = size + 'px'; }
  });
}
</script>
</body>
</html>
