<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Фон экранов вне игры: затемнение и точки по сетке клеток мира (клетка — 32 px) -->
  <defs>
    <pattern id="d" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8d5ee" fill-opacity=".08"/></pattern>
    <radialGradient id="v" cx=".62" cy=".5" r=".75"><stop offset="0" stop-color="#14121d"/><stop offset="1" stop-color="#06050a"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#v)"/>
  <rect width="1920" height="1080" fill="url(#d)"/>
</svg>
